<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Botanical leaf path -->
  <g transform="translate(256,256) scale(0.85) translate(-256,-256)">
    <!-- Leaf base glow -->
    <path d="M 256 64 C 150 120 100 230 115 340 C 130 430 220 450 256 460 C 292 450 382 430 397 340 C 412 230 362 120 256 64 Z" 
          fill="url(#leafGrad)" />
    
    <!-- Leaf central vein -->
    <path d="M 256 90 Q 256 260 256 440" stroke="#047857" stroke-width="12" stroke-linecap="round" />
    
    <!-- Secondary veins -->
    <path d="M 256 160 Q 200 180 160 210" stroke="#047857" stroke-width="8" stroke-linecap="round" />
    <path d="M 256 190 Q 312 210 352 240" stroke="#047857" stroke-width="8" stroke-linecap="round" />
    <path d="M 256 250 Q 190 280 150 320" stroke="#047857" stroke-width="8" stroke-linecap="round" />
    <path d="M 256 280 Q 320 310 360 350" stroke="#047857" stroke-width="8" stroke-linecap="round" />
    <path d="M 256 340 Q 200 370 170 400" stroke="#047857" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Diagnostic Reticle / Camera Target Grid -->
  <!-- Top-left corner -->
  <path d="M 120 170 L 120 120 L 170 120" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  <!-- Top-right corner -->
  <path d="M 342 120 L 392 120 L 392 170" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  <!-- Bottom-left corner -->
  <path d="M 120 342 L 120 392 L 170 392" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  <!-- Bottom-right corner -->
  <path d="M 342 392 L 392 392 L 392 342" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />

  <!-- Scanning laser line -->
  <rect x="100" y="248" width="312" height="8" fill="url(#scanGrad)" filter="url(#glow)" />

  <!-- AI sparkle nodes -->
  <circle cx="390" cy="120" r="10" fill="#facc15" filter="url(#glow)" />
  <circle cx="120" cy="390" r="8" fill="#38bdf8" filter="url(#glow)" />
</svg>
